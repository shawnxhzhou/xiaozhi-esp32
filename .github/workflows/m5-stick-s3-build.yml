# 给 M5 Stick S3 固件编译。push 到 m5-stick-s3 分支或手动触发都会跑。
# 产物：build/merged-binary.bin 作为 artifact 可下载，烧板就用它。

name: m5-stick-s3 firmware build

on:
  push:
    branches: [m5-stick-s3]
    paths:
      - 'main/**'
      - 'managed_components/**'
      - 'sdkconfig.defaults*'
      - 'CMakeLists.txt'
      - '.github/workflows/m5-stick-s3-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inject board type
        run: |
          # StickS3 是 8MB flash + 8MB PSRAM，xiaozhi 默认假设 16MB flash
          # 这里覆盖 flash size 和分区表为 8MB 版本
          cat > sdkconfig.defaults.m5stick <<EOF
          CONFIG_IDF_TARGET="esp32s3"
          CONFIG_BOARD_TYPE_M5_STICK_S3=y
          CONFIG_ESPTOOLPY_FLASHSIZE_16MB=n
          CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y
          CONFIG_ESPTOOLPY_FLASHSIZE="8MB"
          CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions/v2/8m.csv"
          EOF
          cat sdkconfig.defaults.m5stick

      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.defaults.m5stick" \
                 set-target esp32s3
          idf.py build
          idf.py merge-bin

      - name: Show output info
        run: |
          ls -la build/
          ls -la build/merged-binary.bin
          echo "merged-binary.bin size: $(du -h build/merged-binary.bin | cut -f1)"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: m5-stick-s3-firmware
          path: |
            build/merged-binary.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/xiaozhi.bin
          retention-days: 30
